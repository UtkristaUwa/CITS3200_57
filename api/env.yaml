GOOGLE_CLOUD_PROJECT: "tenderai-dev"
BIGQUERY_DATASET: "TenderAI"
USE_MOCK_DATA: "false"
# Shared tender_processor.cfg the admin config page reads and writes. Must stay
# in this file: deploys pass --env-vars-file, which replaces the whole
# environment, so anything set by hand in the console is lost on the next one.
RUNTIME_CONFIG_BUCKET: "tenderai-dev-runtime-config"
RUNTIME_CONFIG_OBJECT: "runtime/tender_processor.cfg"
ALLOWED_ORIGINS: "https://tenderai-dev-f0283.firebaseapp.com"
AUTO_PROVISION_SSO: "true"
ALLOWED_EMAIL_DOMAINS: ""
