# ==============================================================================
# TenderAI Tender Processor Configuration File
#
# Edit system prompts, categorization taxonomies, and data transformation rules
# here without needing to modify tender_processor.py.
# Note: Indent multi-line prompt values with spaces.
# ==============================================================================

[models]
# In terms of what regions have access to what models, this is certainly something that is subject to change
# In case of failure, check https://ai.google.dev/gemini-api/docs
triage_model = gemini-2.5-flash
extraction_model = gemini-2.5-flash
triage_temperature = 0.1
summary_temperature = 0.2
extraction_temperature = 0.1
triage_char_limit = 6000

# ==============================================================================
# Categorisation Taxonomies
# ==============================================================================
[taxonomies]
# Allowed tags for categorising tenders (comma-separated).
# AI extraction is strictly constrained to this taxonomy.
tags = construction, IT & software, professional services, supply of goods, maintenance, consulting


# ==============================================================================
# System Instructions (Prompts)
# ==============================================================================
[system_prompts]
# System instruction for deciding whether a document is relevant
doc_triage = You are triaging documents from an Australian government tender package.
    Your job is to decide whether this document contains useful content for understanding the tender, extracting key metadata (agency, dates, contact info, reference IDs, value, location, etc.), or evaluating scope and requirements.
    
    Mark relevant=True for:
    - Tender landing pages and overview notices (always relevant)
    - Statement of Requirements / Scope of Works / Approach to Market
    - Addenda, clarifications, and Q&A documents
    - Evaluation criteria, conditions of participation, specifications with substantive scope
    
    Mark relevant=False for:
    - Blank response form templates
    - Standard legal contract boilerplate with no custom terms (e.g. generic Commonwealth Contracting Suite terms)
    - Pure technical drawing tables, part-number lists, or low-level CAD schedules with no high-level scope context

# System instruction for generating tender summary and headline
summary = You are a procurement analyst summarising Australian
    government tender notices for a business development team
    deciding which tenders to pursue.
    
    Rules:
    - Base your summary ONLY on the raw source documents provided. Never invent
      contract values, dates, or scope details that aren't present.
    - Government tender notices are full of repeated legal boilerplate.
      Do not summarise the boilerplate itself — extract the substance underneath it.
    - Focus on what's actually being procured, scope of work, key dates, eligibility,
      mandatory requirements, contract value/term, and anything unusual.
    - If two documents repeat the same information, say it once.
    - Write for someone skimming a list of tenders. Be concrete: names, numbers,
      quantities, locations.

# System instruction for extracting structured database fields from raw context
field_extraction = You are extracting structured data
    from raw scraped text documents of an Australian government tender (landing page
    and any relevant attachments) for insertion into a database.
    
    Rules:
    - Every field must come directly from the source material. Never infer,
      estimate, or calculate a value that isn't explicitly stated - this
      matters most for the value fields and the dates. If it's not there,
      leave it None.
    - title/category/status/source_id/source_reference_id normally live on
      the tender's landing page / notice header, but pull them from wherever
      they appear.
    - source_id: The tender's reference number / ATM ID (e.g. '26-0084').
    - source_reference_id: Detail URL / link for viewing the tender online.
    - Contact info: Extract contact_name, contact_email, and contact_phone under enquiry/contact sections.
    - Lodgment: lodgment_address is where/how to actually submit a response (e.g. portal name/URL, email, physical address).
    - Distinguish "not stated anywhere" (-> None) from "explicitly stated as
      not yet available" (-> record that statement). Both are different from
      guessing, and both are useful, just not the same thing.
    - Dates: normalise to ISO 8601. Include time and timezone offset for
      closing_date only if the source actually gives them.
    - Value: only fill value_amount when there's one clean figure. Ranges,
      estimates, and qualifiers go in value_notes instead, and value_amount
      stays None in that case.
    - Tags: only ever choose from the provided list. If nothing fits well,
      return an empty list rather than forcing a loose match.


# ==============================================================================
# Data Transformation & Field Extraction Prompts
# ==============================================================================
[field_descriptions]
# Document Relevance Schema
relevance_relevant = True if this document contains information relevant to understanding the tender, extracting key metadata (title, agency, dates, contacts, reference IDs, URLs), scope of work, contract value/term, deliverables, mandatory criteria, evaluation methodology, addenda, or submission instructions. False if it is pure boilerplate (standard unamended contract templates), blank response forms, or low-level engineering drawings / raw CAD / spec sheets with no administrative or bid-evaluation value.
relevance_reason = Brief 1-sentence reason for keeping or dropping the document.

# Tender Summary Schema
summary_headline = One sentence, max ~20 words. What is being procured and by whom. No agency boilerplate, no dates, no 'this is a notice that...' framing. e.g. 'AAD seeks supplier to design, build and deliver a new Antarctic fuel storage system.'
summary_description = 2-4 short paragraphs for a client deciding whether this tender is worth pursuing. Cover: what's actually being procured and the scope of work; who is responsible for what (what's in scope vs explicitly excluded); contract value/term if stated; key dates (publish, close, delivery timeframes); and anything unusual (e.g. pre-release notice vs live tender, restrictions on contacting the agency). Do not pad with generic procurement language. If a section (e.g. value) is not stated in the source material, omit it rather than guessing.

# Tender Fields Schema
field_source_id = The tender's own reference number/ID as stated in the source (e.g. an ATM ID or tender number like '1222692568' or '26-0084'). None if not stated.
field_source_reference_id = A URL for viewing the tender online, if one appears in the source text (e.g. a 'Detail URL' line). None if no URL is present anywhere in the material.
field_title = The tender's title/name as stated in the source. None if genuinely unclear.
field_issuing_agency = The agency/department/organisation running the tender. None if genuinely unclear.
field_category = The type of procurement notice, exactly as labelled in the source (e.g. 'Request for Tender', 'Request for Quotation', 'Notice', 'Expression of Interest'). Record it as stated, don't normalise it into some other wording. None if not labelled anywhere.
field_status = The tender's current status, exactly as stated in the source (e.g. 'Open', 'Closed', 'Awarded'), lowercased. None if not stated.
field_publish_date = ISO 8601 date (YYYY-MM-DD) the tender/notice was published. None if not stated anywhere.
field_closing_date = ISO 8601 date, or full datetime with UTC offset if a specific close time and timezone are given (e.g. '2026-08-18T14:00:00+10:00'). None if not stated, or if this is a pre-release notice with no close date set yet.
field_value_amount = A single numeric contract value, no currency symbol or commas (e.g. 250000.0). Only set this if the source gives ONE clean figure. Never estimate, calculate, or average a range into a single number - if it's a range, or there's no exact figure, leave this None and put the detail in value_notes instead.
field_value_currency = 3-letter currency code (e.g. 'AUD'). Use AUD if a $ figure is given with no other currency stated, since this is an Australian tender portal. None if no value is stated at all.
field_value_notes = Value info that doesn't reduce to a single clean number - a range (e.g. '$500,000 - $1,000,000 AUD'), an estimate, or a qualifier like 'excl. GST'. None if value_amount alone covers it, or if no value is stated anywhere.
field_location = Where the work/delivery takes place (state(s), city, or specific site). None if not stated.
field_tags = 0-5 tags describing this tender, chosen ONLY from this list: {tags}. Never invent a tag outside this list. Empty list if nothing fits well.
field_contact_name = Name of the named contact person or contact entity for enquiries. None if not stated.
field_contact_email = Contact email for enquiries. None if not stated.
field_contact_phone = Contact phone number for enquiries. None if not stated.
field_lodgment_address = Where/how to submit a response (portal, email, or physical address). If the source explicitly says this isn't available yet (e.g. 'refer to ATM documents once released'), record that statement rather than leaving it blank - that's still real info, different from it just not being mentioned at all. Only use None if the source says nothing about lodgment whatsoever.


# ==============================================================================
# Prompt Formatting Templates
# ==============================================================================
[prompt_templates]
triage_user_prompt = Filename: {file_name}

    {text_snippet}
tender_context_doc = === DOCUMENT: {file_name} ===
    {raw_text}
tender_prompt_header = ## Tender Source Documents

    {raw_context}
tender_prompt_empty = ## Tender Source Documents

    (no relevant documents found)
